services:

  mongodb:
    image: mongo:7.0
    container_name: sih-mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sih-network

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - sih-network

  ml-service1:
    build:
      context: ./ml-service1
    container_name: sih-ml-service1-container
    ports:
      - "8000:8000"
    env_file:
      - ./ml-service1/.env
    networks:
      - sih-network

  backend:
    build: ./backend
    container_name: sih-backend-container
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      ML_SERVICE_URL: http://ml-service1:8000
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      # Keep the app on the same Atlas database currently used in Compass.
      # An explicit MONGODB_URI still takes precedence for other deployments.
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://priyanshuvats672_db_user:hk7UgsDv0n7ozjQG@cluster0.ox9lnxi.mongodb.net/test?appName=Cluster0}
    depends_on:
      - mongodb
      - mqtt-broker
      - ml-service1
    networks:
      - sih-network

  simulator:
    build: ./simulator
    container_name: sih-simulator-container
    env_file:
      - ./simulator/.env
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - sih-network

  prometheus:
    image: prom/prometheus
    container_name: sih-prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - sih-network
  
  grafana:
    image: grafana/grafana
    container_name: sih-grafana-container
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - sih-network

networks:
  sih-network:
    driver: bridge

volumes:
  mongo-data:
